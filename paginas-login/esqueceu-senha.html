<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emprega+ | Recuperar Senha</title>
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    <div class="login-page">

        <div class="lado-esquerdo">
            <div class="logo-area">
                <!-- Usando a mesma logo das outras telas -->
                <img src="../img/LEM2.png" alt="Logo Emprega+" class="logo">
                <div>
                    <h1>EMPREGA+</h1>
                    <p>Recuperação de conta</p>
                </div>
            </div>

            <div class="texto-esquerdo">
                <!-- Ícone de cadeado com chave para remeter a segurança/senha -->
                <div class="icone-cadeado">🔐</div>
                <h2>Problemas para entrar?</h2>
                <p>Fique tranquilo! Informe o e-mail associado à sua conta e enviaremos as instruções para você redefinir sua senha.</p>
            </div>

            <div class="decoracao"></div>
        </div>


        <div class="lado-direito">
            <div class="login-card">
                <h2>Recuperar Senha</h2>
                <p class="subtitulo">Digite seu e-mail para receber o link de recuperação</p>

                <form action="#">
                    <label>E-mail</label>
                    <input type="text" placeholder="Digite seu e-mail cadastrado" required>

                    <button type="submit" class="btn-entrar">Enviar link de recuperação</button>

                    <!-- Link para voltar ao Login usando a mesma classe que criamos antes -->
                    <div class="novo-cadastro">
                        Lembrou a senha? <a href="login.html">Voltar ao login</a>
                    </div>
                </form>

            </div>
        </div>

    </div>
</body>
</html>
