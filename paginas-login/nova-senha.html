<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emprega+ | Nova Senha</title>
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    <div class="login-page">

        <div class="lado-esquerdo">
            <div class="logo-area">
                <img src="../img/LEM2.png" alt="Logo Emprega+" class="logo">
                <div>
                    <h1>EMPREGA+</h1>
                    <p>Redefinir acesso</p>
                </div>
            </div>

            <div class="texto-esquerdo">
                <div class="icone-cadeado">🔑</div>
                <h2>Quase lá!</h2>
                <p>Crie uma nova senha forte para proteger sua conta e voltar a navegar pelas vagas da plataforma.</p>
            </div>

            <div class="decoracao"></div>
        </div>

        <div class="lado-direito">
            <div class="login-card">
                <h2>Nova Senha</h2>
                <p class="subtitulo">Crie uma nova senha para sua conta</p>

                <form action="login.html">
                    <label>Nova Senha</label>
                    <input type="password" placeholder="Digite a nova senha" required>

                    <label>Confirmar Nova Senha</label>
                    <input type="password" placeholder="Repita a nova senha" required>

                    <button type="submit" class="btn-entrar">Salvar e Entrar</button>
                </form>

            </div>
        </div>

    </div>
</body>
</html>
